<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noroff FED2 JS2 CA</title>

<body>
  <section class="bg-gradient-to-r from-blue-700 to-pink-300 p-5 text-white h-48 md:h-64 flex flex-col justify-around">
    <div class="absolute top-5">
      <img src="/images/noroff-logo.png" alt="Noroff Logo" class="w-16 h-auto" />
    </div>
    <h1 class="sm:text-2xl md:text-4xl text-center">Create Post</h1>
  </section>

  <form name="createPost">
    <div>
      <label for="title">Title</label>
      <input id="title" type="text" name="title" required title="Title of post" />
    </div>

    <div>
      <label for="body">Text</label>
      <input id="body" type="text" name="body" required title="Write your post here!" />
    </div>

    <!-- <div>
      <label for="media">Image</label>

        pattern="[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*)"
        title="Please enter a valid noroff.no or stud.noroff.no address" />
    </div> -->

    <button>Create Post</button>
  </form>
</body>

</html>
