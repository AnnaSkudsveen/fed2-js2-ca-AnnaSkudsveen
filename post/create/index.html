<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noroff FED2 JS2 CA</title>
  <script type="module" src="/src/app.js"></script>
</head>

<body class="h-screen flex flex-col items-center">
  <section
    class="bg-gradient-to-r from-blue-700 to-pink-300 p-5 text-white h-48 md:h-64 flex flex-col justify-around w-full">
    <div class="absolute top-5">
      <img src="/images/noroff-logo.png" alt="Noroff Logo" class="w-16 h-auto" />
    </div>
    <h1 class="text-3xl md:text-4xl lg:text-5xl text-center">Create Post</h1>
  </section>

  <form name="createPost"
    class="flex flex-col items-center gap-10 h-auto w-3/4 md:w-2/4 lg:w-2/6 justify-around m-10 border border-blue-600 rounded">
    <div class="mt-6 mb-2 w-full flex justify-center">
      <label for="title" hidden>Title</label>
      <input id="title" type="text" name="title" placeholder="Title" required title="Title of post"
        class="border border-blue-700 w-2/3 p-1 rounded-sm" />
    </div>

    <div class="mt-0 mb-5 w-full flex justify-center">
      <label for="body" hidden>Text</label>
      <textarea name="body" id="body" placeholder="Text" required title="Write your post here!"
        class="border border-blue-700 w-2/3 p-1 rounded-sm h-28"></textarea>
    </div>

    <!-- <div>
      <label for="media">Image</label>
      <input id="media" type="text" name="media"
        pattern="[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*)"
        title="Please enter a valid noroff.no or stud.noroff.no address" />
    </div> -->

    <button
      class="bg-blue-700 text-white rounded text-sm sm:text-xl w-20 sm:w-28 md:w-32 h-8 sm:h-10 md:h-12 mb-5">Create
      Post</button>
  </form>
</body>

</html>
