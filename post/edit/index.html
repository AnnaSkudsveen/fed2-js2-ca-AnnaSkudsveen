<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noroff FED2 JS2 CA</title>
  <script type="module" src="/src/app.js"></script>
</head>

<body>
  <section class="bg-gradient-to-r from-blue-700 to-pink-300 p-5 text-white h-48 md:h-64 flex flex-col justify-around">
    <div class="absolute top-5">
      <img src="/images/noroff-logo.png" alt="Noroff Logo" class="w-16 h-auto" />
    </div>
    <h1 class="sm:text-2xl md:text-4xl text-center">Edit Post</h1>
  </section>

  <form name="editPost" id="updatePost">
    <div>
      <label for="title">Title</label>
      <input id="title" type="text" name="title" required maxlength="20" title="Edit title of your post" />
    </div>

    <div>
      <label for="body">Text</label>
      <input id="body" type="text" name="body" required title="Edit the text in your post" />
    </div>
    <button>Edit Post</button>
  </form>
  <button class="deleteBtn">Delete</button>
</body>

</html>
