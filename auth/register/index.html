<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noroff FED2 JS2 CA</title>
  <script type="module" src="/src/app.js"></script>
  <link rel="stylesheet" href="../../src/css/style.css">
</head>

<body class="bg-gradient-to-r from-blue-700 to-pink-300 
flex justify-center flex-col h-screen w-screen items-center gap-10">
  <h1 class="text-xl sm:text-2xl lg:text-4xl text-white">Register</h1>

  <section class=" bg-white rounded-lg w-72 sm:w-max p-4 sm:p-7 md:p-9 min-h-80 flex flex-col justify-around">
    <form name="register" id="registerForm" class="flex flex-col gap-5 justify-around items-center h-80 sm:h-96">
      <section class="flex flex-col gap-8">
        <div>
          <label for="name" hidden>Name</label>
          <input id="name" type="text" name="name" required maxlength="20" pattern="^[\w]+$" placeholder="Name"
            title="Please enter a username using only letters and numbers" class="bg-blue-100 border 
              border-blue-900 
              placeholder:text-blue-600 
              pl-2
              rounded
              w-64 sm:w-80" />
        </div>

        <div>
          <label for="email" hidden>Email</label>
          <input id="email" type="email" name="email" placeholder="Email" pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
            title="Please enter a valid noroff.no or stud.noroff.no address" class="bg-blue-100 border 
              border-blue-900 
              placeholder:text-blue-600 
              pl-2
              rounded
              w-64 sm:w-80" />
        </div>

        <div>
          <label for="password" hidden>Password</label>
          <input type="password" name="password" placeholder="Password" id="password" required minlength="8" class="bg-blue-100 border 
              border-blue-900 
              placeholder:text-blue-600 
              pl-2
              rounded
              w-64 sm:w-80" />
        </div>
      </section>
      <section class="flex gap-2">
        <a href="/auth/login/"
          class="bg-transparent text-blue-700 border border-blue-700 rounded text-sm sm:text-xl w-20 sm:w-28 md:w-32 h-8 sm:h-10 md:h-12 text-center content-center">Login</a>
        <button
          class="bg-blue-700 text-white rounded text-sm sm:text-xl w-20 sm:w-28 md:w-32 h-8 sm:h-10 md:h-12">Register</button>
      </section>

    </form>
  </section>


</body>

</html>
