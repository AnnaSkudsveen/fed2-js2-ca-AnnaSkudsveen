<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noroff FED2 JS2 CA</title>
  <script type="module" src="/src/app.js"></script>
</head>

<body class="bg-gradient-to-r from-blue-700 to-pink-300 
flex justify-center flex-col h-screen w-screen items-center gap-10">
  <h1 class="text-xl sm:text-2xl lg:text-4xl text-white">Login</h1>
  <section class=" bg-white rounded-lg w-72 sm:w-max p-4 sm:p-7 md:p-9 min-h-80 flex flex-col justify-around">

    <form name="login" class="flex flex-col gap-5 justify-around items-center h-80 sm:h-96">
      <section class="flex flex-col gap-8 pt-16">
        <div>
          <label for="email" class="hidden">Email</label>
          <input id="email" type="email" name="email" required placeholder="Email" class="bg-blue-100 border 
            border-blue-900 
            placeholder:text-blue-600 
            pl-2
            rounded
            w-64 sm:w-80" />
        </div>

        <div>
          <label for="password" class="hidden">Password</label>
          <input type="password" name="password" id="password" required placeholder="Password" class="bg-blue-100 border 
          border-blue-900 
          placeholder:text-blue-600 
          pl-2
          rounded
          w-64 sm:w-80" />
        </div>
      </section>

      <div class="flex gap-2">
        <a href="/auth/register/"
          class="bg-transparent text-blue-700 border border-blue-700 rounded text-sm sm:text-xl w-20 sm:w-28 md:w-32 h-8 sm:h-10 md:h-12 text-center content-center">
          Register
        </a>
        <button class="bg-blue-700 text-white rounded text-sm sm:text-xl w-20 sm:w-28 md:w-32 h-8 sm:h-10 md:h-12">
          Login
        </button>
      </div>

    </form>
  </section>
</body>

</html>
